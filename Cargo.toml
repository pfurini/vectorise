[package]
name = "vectorise"
version = "0.1.0"
edition = "2024"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
kurbo = "0.13"
oxvg_ast = { version = "0.0.8", default-features = false, features = ["roxmltree", "serialize", "visitor", "selectors"] }
oxvg_optimiser = { version = "0.0.8", default-features = false }
tiny-skia = "0.11"
vtracer = "=1.0.0-alpha.4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
