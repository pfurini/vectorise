[package]
name = "vectorise"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Convert raster images into maximally compact SVG, emitting native shape primitives wherever a traced region is one."
authors = ["Paolo Furini <paolo.furini@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/pfurini/vectorise"
readme = "README.md"
categories = ["command-line-utilities", "graphics", "multimedia::images"]
keywords = ["svg", "vectorization", "trace", "raster", "cli"]
exclude = ["/.github", "/docs", "/tests/fixtures", "/justfile", "/deny.toml"]

[lib]
name = "vectorise"
path = "src/lib.rs"

[[bin]]
name = "vectorise"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
glob = "0.3.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
kurbo = "0.13"
tempfile = "3.27.0"
thiserror = "2.0.20"
tiny-skia = "0.11"
vtracer = "=1.0.0-alpha.4"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.11"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Deliberate allowances, each justified:
module_name_repetitions = "allow"   # writer::Writer is fine
must_use_candidate = "allow"        # too noisy on builders
missing_errors_doc = "warn"         # keep, document every Err
unwrap_used = "deny"                # in src/; tests may use expect()
expect_used = "warn"
panic = "deny"
indexing_slicing = "warn"
float_cmp = "warn"                  # use approx helpers
# Duplicate transitive versions are outside our control (vtracer pulls one
# flo_curves, visioncortex another). deny.toml already warns on them.
multiple_crate_versions = "allow"
