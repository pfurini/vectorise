[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "pfurini/homebrew-tap"
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Which actions to run on pull requests
pr-run-mode = "plan"
# Ship the third-party notices beside every binary: several dependency
# licences require their notice to travel with the binary.
include = ["THIRD-PARTY.md"]
# The formula is generated and attached to every release, but not pushed to the
# tap yet. Pushing needs two things this repository does not have: the tap
# repository itself, and a personal access token with write access to it
# (`secrets.GITHUB_TOKEN` is scoped to this repository only). To enable, create
# the tap, add the token as `HOMEBREW_TAP_TOKEN`, and put back:
#   publish-jobs = ["homebrew"]
# `dist` has no universal2 target, so the fat macOS binary is built by a job
# of ours after the release exists. See .github/workflows/universal-macos.yml.
post-announce-jobs = ["./universal-macos", "./release-smoke"]
