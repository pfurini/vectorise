# cargo-deny configuration. See IMPLEMENTATION_PLAN.md §0.5: licensing is a hard
# constraint, and `cargo deny check` gates every phase in CI.

[graph]
# The targets we ship. Checking them all keeps a dependency that is fine on
# macOS but GPL on Linux from slipping through.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# `cargo audit` runs on its own weekly schedule; this catches the same
# advisories inside the normal `cargo deny check` run.
ignore = []

[licenses]
# Allow-list semantics: any license not named here is denied, which is how
# GPL-*, LGPL-*, and AGPL-* stay out without being listed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
