# Static linking for the musl targets we ship, so the released Linux binaries
# report "not a dynamic executable". Asserted in CI (Phase 10).

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static"]
